<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#1d3557"/>
    </linearGradient>
    <linearGradient id="banner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e63946"/>
      <stop offset="0.55" stop-color="#c1121f"/>
      <stop offset="1" stop-color="#ff6b6b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4a261"/>
      <stop offset="1" stop-color="#e76f51"/>
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="700" fill="url(#bg)"/>
  <circle cx="700" cy="620" r="150" fill="#e63946" opacity="0.1"/>
  <circle cx="90" cy="90" r="130" fill="#f4a261" opacity="0.08"/>

  <g transform="translate(400,300)">
    <g transform="perspective(600px) rotateX(3deg)">
      <rect x="-300" y="-160" width="600" height="320" rx="10" fill="#e63946" filter="url(#shadow1)"/>
      <rect x="-300" y="-160" width="600" height="320" rx="10" fill="url(#banner)" opacity="0.92"/>

      <path d="M-300,-160 L-300,160" stroke="#ffffff" stroke-width="3" opacity="0.15"/>
      <path d="M300,-160 L300,160" stroke="#ffffff" stroke-width="3" opacity="0.15"/>
      <path d="M-300,-160 L300,-160" stroke="#ffffff" stroke-width="3" opacity="0.15"/>
      <path d="M-300,160 L300,160" stroke="#ffffff" stroke-width="3" opacity="0.15"/>

      <circle cx="0" cy="-70" r="110" fill="#ffffff" opacity="0.08"/>
      <circle cx="0" cy="-70" r="160" fill="#ffffff" opacity="0.05"/>

      <rect x="-280" y="18" width="88" height="88" rx="8" fill="#ffd7d7" opacity="0.15"/>
      <text x="-236" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#ffffff">SR</text>

      <text x="-165" y="10" font-family="Arial, sans-serif" font-size="88" font-weight="900" fill="#ffffff" letter-spacing="2">BIG<b> SALE</b></text>
      <text x="-165" y="58" font-family="Arial, sans-serif" font-size="26" fill="#ffd7d7" letter-spacing="8">UP TO 50% OFF</text>
      <text x="-165" y="92" font-family="Arial, sans-serif" font-size="17" fill="#ffffff" opacity="0.9" letter-spacing="3">ALL PRINTING SERVICES</text>

      <rect x="140" y="-120" width="120" height="120" rx="60" fill="url("#gold")" stroke="#ffffff" stroke-width="4"/>
      <text x="200" y="-68" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#fff">50%</text>
      <text x="200" y="-52" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fff" opacity="0.9">OFF</text>

      <text x="0" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" opacity="0.8" letter-spacing="4">VISIT OUR SHOP • FLEX • CARDS • FRAMES • WEDDING CARDS • BOARDS</text>
    </g>
  </g>

  <text x="400" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="6">FLEX BANNER</text>
  <text x="400" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#a8dadc" letter-spacing="4">SALE PROMOTION DESIGN</text>
  <line x1="330" y1="572" x2="470" y2="572" stroke="#e63946" stroke-width="3" stroke-linecap="round"/>
  <text x="400" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#8d99ae" letter-spacing="2">SAMPLE DESIGN • SRI SIGN ADS</text>
</svg>