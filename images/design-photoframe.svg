<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#264653"/>
      <stop offset="1" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="sunrise" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4a261"/>
      <stop offset="0.5" stop-color="#e76f51"/>
      <stop offset="1" stop-color="#2a9d8f"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5a2b"/>
      <stop offset="1" stop-color="#5c3a1e"/>
    </linearGradient>
    <filter id="shadow4" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="matte" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="700" fill="url(#bg)"/>
  <circle cx="680" cy="90" r="140" fill="#2a9d8f" opacity="0.1"/>

  <g transform="translate(400,300)" filter="url(#shadow4)">

    <rect x="-185" y="-225" width="370" height="36" rx="8" fill="#6b4423"/>
    <rect x="-185" y="189" width="370" height="36" rx="8" fill="#6b4423"/>
    <rect x="-201" y="-213" width="32" height="400" rx="8" fill="#5c3a1e"/>
    <rect x="169" y="-213" width="32" height="400" rx="8" fill="#5c3a1e"/>

    <rect x="-169" y="-189" width="338" height="378" rx="4" fill="#ffffff" filter="url(#matte)"/>
    <rect x="-169" y="-189" width="338" height="378" rx="4" fill="url(#sunrise)" opacity="0.85"/>

    <circle cx="-40" cy="-80" r="55" fill="#ffd7a1" opacity="0.9"/>
    <circle cx="-40" cy="-80" r="55" fill="#fff3d6" opacity="0.4"/>

    <path d="M-169,120 C-100,70 -30,60 60,110 C110,140 150,150 169,130 L169,189 L-169,189 Z" fill="#2a9d8f"/>
    <path d="M-169,150 C-80,95 20,90 120,130 C150,145 165,150 169,145 L169,189 L-169,189 Z" fill="#264653" opacity="0.7"/>

    <line x1="-60" y1="-35" x2="-20" y2="-35" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
    <circle cx="-20" cy="-35" r="4" fill="#ffffff" opacity="0.9"/>

    <text x="60" y="-90" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#fff">Memories</text>
    <text x="60" y="-66" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="4" fill="#fff" opacity="0.9">FRAMED FOREVER</text>
    <rect x="20" y="-44" width="80" height="22" rx="11" fill="#ffffff" opacity="0.2"/>
    <text x="60" y="-30" text-anchor="middle" font-family="Arial" font-size="10" fill="#fff" opacity="0.9">PRINTED ON CANVAS</text>
  </g>

  <text x="400" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="6">PHOTO FRAMES</text>
  <text x="400" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#f4a261" letter-spacing="4">CANVAS • ACRYLIC • WOODEN FRAMES</text>
  <line x1="330" y1="612" x2="470" y2="612" stroke="#2a9d8f" stroke-width="3" stroke-linecap="round"/>
  <text x="400" y="645" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#8d99ae" letter-spacing="2">SAMPLE DESIGN • SRI SIGN ADS</text>
</svg>