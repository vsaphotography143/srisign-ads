<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3557"/>
      <stop offset="1" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e63946"/>
      <stop offset="1" stop-color="#8d0801"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4a261"/>
      <stop offset="1" stop-color="#e76f51"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9ecef"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="800" height="700" fill="url(#bg)"/>

  <circle cx="80" cy="620" r="140" fill="#e63946" opacity="0.12"/>
  <circle cx="720" cy="80" r="180" fill="#f4a261" opacity="0.1"/>

  <g transform="translate(400,335)" filter="url(#shadow)">
    <g transform="rotate(-6)">
      <rect x="-125" y="-165" width="250" height="330" rx="8" fill="#f8f9fa"/>
      <rect x="-125" y="-165" width="250" height="330" rx="8" fill="url(#page)" opacity="0.6"/>
      <g transform="translate(-100,-135)" clip-path="url(#coverClip)">
        <rect x="0" y="0" width="200" height="120" fill="url(#cover)"/>
        <rect x="0" y="0" width="200" height="120" fill="url(#cover)" opacity="0.8"/>
        <line x1="-20" y1="120" x2="220" y2="-20" stroke="#ffffff" stroke-width="26" opacity="0.15"/>
        <rect x="30" y="95" width="140" height="10" rx="5" fill="#ffffff" opacity="0.9"/>
        <rect x="50" y="112" width="100" height="5" rx="2.5" fill="#ffffff" opacity="0.5"/>
      </g>
      <rect x="-100" y="40" width="80" height="7" rx="3.5" fill="#a4161a" opacity="0.8"/>
      <rect x="-100" y="55" width="120" height="7" rx="3.5" fill="#888" opacity="0.5"/>
      <rect x="-100" y="70" width="60" height="7" rx="3.5" fill="#888" opacity="0.35"/>
      <rect x="-100" y="92" width="140" height="7" rx="3.5" fill="#a4161a" opacity="0.8"/>
      <rect x="-100" y="107" width="110" height="7" rx="3.5" fill="#888" opacity="0.5"/>
      <rect x="-100" y="122" width="75" height="7" rx="3.5" fill="#888" opacity="0.35"/>
      <rect x="-100" y="150" width="55" height="55" rx="6" fill="url(#accent)"/>
      <rect x="-90" y="160" width="25" height="6" rx="3" fill="#fff" opacity="0.8"/>
      <rect x="-90" y="171" width="18" height="5" rx="2.5" fill="#fff" opacity="0.6"/>
    </g>

    <g transform="translate(-70,30) rotate(10)">
      <rect x="-125" y="-165" width="250" height="330" rx="8" fill="#f8f9fa" opacity="0.9"/>
      <rect x="-100" y="-135" width="200" height="120" fill="#457b9d" rx="4"/>
      <rect x="-100" y="-135" width="200" height="120" fill="#457b9d" opacity="0.7"/>
      <circle cx="-10" cy="-75" r="34" fill="#e0fbfc" opacity="0.2"/>
      <circle cx="55" cy="-100" r="22" fill="#a8dadc" opacity="0.3"/>
      <rect x="-100" y="-8" width="170" height="8" rx="4" fill="#2b2d42"/>
      <rect x="-100" y="10" width="140" height="8" rx="4" fill="#8d99ae"/>
      <rect x="-100" y="28" width="160" height="6" rx="3" fill="#adb5bd"/>
      <rect x="-100" y="42" width="120" height="6" rx="3" fill="#adb5bd"/>
      <rect x="-100" y="64" width="60" height="60" rx="6" fill="#a8dadc"/>
      <rect x="-90" y="74" width="35" height="6" rx="3" fill="#1d3557"/>
      <rect x="-90" y="86" width="24" height="5" rx="2.5" fill="#1d3557" opacity="0.6"/>
    </g>
  </g>

  <text x="400" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="6">BROCHURE</text>
  <text x="400" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#a8dadc" letter-spacing="4">TRIFOLD CATALOGUE DESIGN</text>
  <line x1="330" y1="610" x2="470" y2="610" stroke="#e63946" stroke-width="3" stroke-linecap="round"/>
  <text x="400" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#8d99ae" letter-spacing="2">SAMPLE DESIGN • SRI SIGN ADS</text>
</svg>