      <rect x="24" y="67" width="60" height="6" rx="3" fill="#8d99ae"/>
      <rect x="24" y="99" width="34" height="12" rx="6" fill="#0d1b2a"/>
    </g>

    <g transform="translate(95,140) rotate(-6)">
      <rect x="0" y="0" width="210" height="126" rx="8" fill="url(#cardG)" filter="url(#shadow2)"/>
      <rect x="0" y="0" width="210" height="42" rx="8" fill="#e63946"/>
      <rect x="0" y="26" width="210" height="16" fill="#e63946"/>
      <circle cx="168" cy="34" r="18" fill="#ffffff" opacity="0.2"/>
      <text x="22" y="29" font-family="Arial" font-size="14" font-weight="800" fill="#ffffff">BUSINESS CARD</text>
      <rect x="22" y="54" width="84" height="8" rx="4" fill="#c1121f" opacity="0.8"/>
