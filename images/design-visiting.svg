      <rect x="0" y="0" width="210" height="42" rx="8" fill="url(#navy)"/>
      <rect x="0" y="26" width="210" height="16" fill="url(#navy)"/>
      <circle cx="30" cy="21" r="10" fill="#ffffff" opacity="0.9"/>
      <rect x="47" y="16" width="55" height="10" rx="5" fill="#ffffff" opacity="0.95"/>
      <circle cx="120" cy="26" r="28" fill="#e63946" opacity="0.25"/>
