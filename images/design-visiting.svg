      <rect x="0" y="0" width="210" height="126" rx="8" fill="url(#cardG)"/>
      <rect x="0" y="0" width="210" height="42" rx="8" fill="url(#copper)"/>
      <rect x="0" y="26" width="210" height="16" fill="url(#copper)"/>
      <rect x="18" y="16" width="60" height="10" rx="5" fill="#ffffff" opacity="0.9"/>
      <rect x="18" y="52" width="80" height="8" rx="4" fill="#6b5317" opacity="0.85"/>
      <rect x="18" y="65" width="58" height="6" rx="3" fill="#8d99ae"/>
